name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag }}
  IMAGE: docker.io/xachaoxizhongzhi/apinto-gateway

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test release changes
        run: go test ./drivers/transcode/thrift ./drivers/plugins/http-to-kitex ./drivers/plugins/response-wrap ./drivers/plugins/user-permissions ./drivers/router/http-router
      - name: Build release archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p .release/package/apinto
          cp -a build/resources/. .release/package/apinto/
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          version_package=github.com/eolinker/apinto/utils/version
          flags="-s -w -X '$version_package.Version=${VERSION#v}' -X '$version_package.gitCommit=$(git rev-parse HEAD)' -X '$version_package.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X '$version_package.buildUser=github-actions' -X '$version_package.goVersion=$(go version)'"
          flags="$flags -X '$version_package.eoscVersion=$(go list -m -f '{{.Version}}' github.com/eolinker/eosc)'"
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags "$flags" -o .release/package/apinto/apinto ./app/apinto
          .release/package/apinto/apinto version
          chmod 755 .release/package/apinto/*.sh
          tar -czf ".release/apinto_${VERSION}_linux_${ARCH}.tar.gz" -C .release/package apinto
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: .release/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .release/package
          file: build/ci/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BUILD_COMMIT }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Verify image entrypoint binary
        env:
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --entrypoint /apinto/apinto "$IMAGE:$VERSION-$ARCH" version

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release/
          merge-multiple: true
      - name: Upload release archives and checksums
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum *.tar.gz > checksums.txt
          gh release upload "$VERSION" *.tar.gz checksums.txt --clobber
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-architecture version
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Update latest for stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease)" = "false" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          fi
